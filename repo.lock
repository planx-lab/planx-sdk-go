PLANX SDK REPOSITORY LOCK (v4.0)

ADR-017 amendment: record/ is a public transport-independent typed business-data
contract alongside sdk/. It owns value/schema validation, cloning, boundary
encoding and storage-size estimation, without Engine drivers/CEL/Lookup logic.
Existing internal/observability is permitted for the protected SDK telemetry work.

## Authority

MUST comply with:
1. [planx-architecture.md](../planx-spec/planx-architecture.md)
2. [planx-ai-guardrails.md](../planx-spec/planx-ai-guardrails.md)
3. [AI_CONTRACT.md](../planx-spec/AI_CONTRACT.md)

---

--------------------------------
PUBLIC API
--------------------------------
sdk/ and record/ are public under ADR-017; internal/ remains SDK-owned.

--------------------------------
FORBIDDEN
--------------------------------
- Exposing internal runtime types as the supported external API, or importing
  internal/ from Engine/plugins. Exports between SDK-owned packages are permitted.
- Any reference to planx-engine
- Plugin-specific logic

--------------------------------
ARCHITECTURAL RULES
--------------------------------
- SDK owns external runtime semantics
- Plugins are passive
- gRPC is an implementation detail

Allowed top-level directories:
- internal/
- sdk/
- record/
- docs/ (contract and verification evidence)

internal/ allowed subdirectories:
- session/
- flow/
- batch/
- runtime/
- util/
- observability/

The following are FORBIDDEN:
- engine logic
- plugin business logic
- example pipelines
- dynamic behavior outside SDK

--------------------------------
AI GUARDRAIL
--------------------------------
Use ownership to decide: external runtime/transport belongs to SDK; business
logic belongs to Plugin or the approved Engine builtin domain. Do not guess
from ambiguity alone; inspect the current contract and affected call path.
